# Plak dit onder de bestaande "services:" in ~/npm/docker-compose.yml,
# naast novapers/breinplek. SQLite: geen aparte databasecontainer, geen
# wachtwoord, geen secrets — alles staat gewoon hier, want niks hiervan
# is nog gevoelig. JWT-secret en encryptiesleutel genereert de app zelf
# bij de eerste start en bewaart ze in de data-map.
#
# Redeploy:
#   cd ~/npm
#   docker compose build --no-cache ai-mc-packbuilder
#   docker compose up -d
#   docker system prune -f

ai-mc-packbuilder:
  build:
    context: https://github.com/iitssjstn/ai-mc-packbuilder.git#main
  container_name: ai-mc-packbuilder
  ports:
    - '3000:3000'
  restart: unless-stopped
  environment:
    - TZ=Europe/Amsterdam
    - APP_URL=https://<JOUW_DOMEIN>
    - AI_PROVIDER_ORDER=openai,anthropic,google
  volumes:
    - ./ai-mc-packbuilder-data:/app/data
